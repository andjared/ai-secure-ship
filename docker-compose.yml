services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/secureship
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on: [postgres]

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=secureship
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  pgdata:
